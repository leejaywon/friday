[project]
name = "friday"
version = "0.1.0"
description = "Personal Telegram agent on your ChatGPT or Claude plan: chat, reminders, Google Calendar, browser."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22",
  "mcp>=1.9",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "cryptography>=44",
  "playwright==1.65.0",
]

[project.scripts]
friday = "friday.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
